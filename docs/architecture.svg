<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<style>
.t{font-size:15px;fill:#0f172a}.s{font-size:12.5px;fill:#334155}.h{font-size:16px;font-weight:700;fill:#0f172a}
.box{fill:#fff;stroke:#334155;stroke-width:1.6;rx:10}.code{fill:#eef2ff;stroke:#4338ca;stroke-width:1.6;rx:10}
.llm{fill:#fff7ed;stroke:#c2410c;stroke-width:1.6;rx:10}.guard{fill:#ecfdf5;stroke:#047857;stroke-width:1.6;rx:10}
.eval{fill:#f0f9ff;stroke:#0369a1;stroke-width:1.6;rx:10}.fail{fill:#fef2f2;stroke:#b91c1c;stroke-width:1.6;rx:10}
.human{fill:#f8fafc;stroke:#64748b;stroke-width:1.6;stroke-dasharray:6 4;rx:10}
.ln{stroke:#334155;stroke-width:1.8;fill:none;marker-end:url(#a)}
</style></defs>
<rect width="1200" height="760" fill="#fff"/>
<text x="24" y="32" class="h" style="font-size:20px">그림 1. SBOM 도달가능성 우선순위 파이프라인 구조 (판정은 코드, AI는 두 자리)</text>
<text x="24" y="54" class="s">파랑 = 결정적 코드 · 주황 = LLM(Gemini) · 초록 = 가드레일 · 하늘 = 평가(Evals) · 빨강 = 실패 처리 · 점선 = 사람</text>

<rect x="24" y="80" width="150" height="120" class="human"/>
<text x="40" y="106" class="h">0 입력</text><text x="40" y="130" class="s">공개·사내 저장소 경로</text><text x="40" y="150" class="s">(읽기 전용, 코드 실행</text><text x="40" y="168" class="s">·설치 없음 — G4)</text>

<rect x="214" y="80" width="190" height="120" class="code"/>
<text x="230" y="106" class="h">1 SBOM 생성</text><text x="230" y="130" class="s">syft → CycloneDX</text><text x="230" y="150" class="s">대체: 잠금 파일 파서</text><text x="230" y="170" class="s">출력: 부품 이름·버전</text>

<rect x="444" y="80" width="190" height="120" class="code"/>
<text x="460" y="106" class="h">2 취약점 조회</text><text x="460" y="130" class="s">OSV(osv.dev) 부품별</text><text x="460" y="150" class="s">캐시 · 병렬 선조회</text><text x="460" y="170" class="s">출력: 경보 = 부품×어드바이저리</text>

<rect x="674" y="80" width="250" height="120" class="code"/>
<text x="690" y="106" class="h">3 도달가능성 판정</text><text x="690" y="130" class="s">소스 분석(Python ast · JS 토큰 · Java import)</text><text x="690" y="150" class="s">취약 심볼 호출 근거 줄 → 도달</text><text x="690" y="170" class="s">import만 → 사용 · 없음 → 미확인</text>

<rect x="964" y="80" width="212" height="120" class="code"/>
<text x="980" y="106" class="h">4 우선순위</text><text x="980" y="130" class="s">점수 = 심각도 가중 × 도달 가중</text><text x="980" y="150" class="s">조치 계획: 패키지별 최저</text><text x="980" y="170" class="s">안전 버전(OSV 고침 버전)</text>

<path d="M174 140 H214" class="ln"/><path d="M404 140 H444" class="ln"/><path d="M634 140 H674" class="ln"/><path d="M924 140 H964" class="ln"/>

<rect x="964" y="250" width="212" height="130" class="llm"/>
<text x="980" y="274" class="h">5 AI 두 자리(Gemini)</text><text x="980" y="296" class="s">① 조치안 두 문장 설명만</text><text x="980" y="314" class="s">② 약한 도달에 「사람 확인</text><text x="980" y="330" class="s">필요」 표시만 — 판정·순위 불변,</text><text x="980" y="346" class="s">도달로 올리기 불가(G1)</text><text x="980" y="364" class="s">실패 시 템플릿 / 표시 붙임</text>
<path d="M1070 200 V250" class="ln"/><path d="M900 200 C900 232 1000 226 1010 250" class="ln" style="stroke-dasharray:5 4;stroke:#c2410c"/>

<rect x="674" y="250" width="250" height="110" class="code"/>
<text x="690" y="276" class="h">6 조치 적용 가지</text><text x="690" y="300" class="s">사본에서 git 가지 fix/sbomreach</text><text x="690" y="320" class="s">requirements·package.json 수정</text><text x="690" y="340" class="s">(npm: lock만 재생성, 스크립트 실행 없음)</text>
<path d="M964 305 H924" class="ln"/>

<rect x="444" y="250" width="190" height="110" class="code"/>
<text x="460" y="276" class="h">7 재스캔</text><text x="460" y="300" class="s">1→4단계를 가지에서 다시</text><text x="460" y="320" class="s">해소·남음·신규 경보 구분</text><text x="460" y="340" class="s">도달 경보 &gt;0이면 2바퀴(최대 3)</text>
<path d="M674 305 H634" class="ln"/>
<path d="M539 250 C539 225 400 225 330 205" class="ln" style="stroke-dasharray:5 4"/>
<text x="330" y="232" class="s">개선 순환</text>

<rect x="214" y="250" width="190" height="110" class="human"/>
<text x="230" y="276" class="h">8 사람 승인</text><text x="230" y="300" class="s">조치 가지 검토·병합</text><text x="230" y="320" class="s">에이전트는 병합·배포</text><text x="230" y="340" class="s">하지 않음</text>
<path d="M444 305 H404" class="ln"/>

<rect x="24" y="400" width="560" height="170" class="guard"/>
<text x="40" y="426" class="h">가드레일 (코드로 집행 · 시험 있음)</text>
<text x="40" y="452" class="s">G1 근거 줄 없는 「도달」 판정은 객체 생성 자체가 거부된다</text>
<text x="40" y="474" class="s">G2 조치안 문장의 버전 숫자는 허용 목록(현재·목표) 밖이면 폐기 → 템플릿</text>
<text x="40" y="496" class="s">G3 「안전합니다」류 단정, 판정이 도달이 아닌데 「도달 가능」 단정 폐기</text>
<text x="40" y="518" class="s">G4 허용 명령만 실행(syft scan · npm lock 전용 · git) — 대상 코드 실행·설치 차단</text>
<text x="40" y="540" class="s">G5 LLM 입력에서 키·토큰·이메일 마스킹 · G6 조회 미완이면 「경보 0 = 깨끗함」 금지</text>

<rect x="616" y="400" width="560" height="170" class="eval"/>
<text x="632" y="426" class="h">평가 (Evals)</text>
<text x="632" y="452" class="s">· 홀드아웃2 33건(수정 코드보다 먼저 동결) 첫 실행값을 대표로 · 정답 일부 Gemini 독립 재판정(kappa)</text>
<text x="632" y="472" class="s">· 단위 시험(pytest, 오프라인, 1초 미만) + 아키텍처 의존 방향 시험</text>
<text x="632" y="492" class="s">· 첫 실행 도달 정밀도 54.5%(v1.2 판정기 42.9%) · 확인 표시 제외 후 75% · 목표 70% 미달</text>
<text x="632" y="512" class="s">· 열어 볼 경보 수(전체→도달→표시 제외) · precision@N · 도달 경보 재스캔 후 0</text>
<text x="632" y="532" class="s">· trace: 도구 호출 1건 = JSONL 1줄(단계·건수·ms·가드레일 차단·대체 경로)</text>
<text x="632" y="552" class="s">· 틀린 곳(본문 속 예시 심볼·설정 로딩)을 한계 표에 그대로 공개</text>

<rect x="24" y="600" width="1152" height="130" class="fail"/>
<text x="40" y="626" class="h">실패 처리 (조용히 넘어가지 않는다)</text>
<text x="40" y="652" class="s">OSV 조회 실패 → 최초 1 + 재시도 2회 → 그 부품을 incomplete로 표시, 보고서에 「스캔 미완」(깨끗하다고 말하지 않음)</text>
<text x="40" y="674" class="s">syft 실행 불가 → 잠금 파일 파서로 대체하고 trace에 fallback 기록 · Gemini 실패 → 상태 코드·원문을 trace에 남기고 429·5xx 재시도, 끝내 실패하면 템플릿</text>
<text x="40" y="696" class="s">소스 분석이 못 보는 것(동적 import·인스턴스 타입) → 「미확인」 또는 「약한 근거」 표시 · 조치 후 새 경보가 생기면 신규로 따로 집계</text>
<text x="40" y="718" class="s">고쳐진 버전이 없는 경보 → 목표 버전 공란 + 「대체 패키지·호출 우회 검토」 문장</text>
</svg>
